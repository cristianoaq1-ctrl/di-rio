<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Diário de Classe - Presença e Notas</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f0f4f8; 
            color: #333;
            margin: 0;
            padding: 20px;
        }
        h1 {
            text-align: center;
            color: #1c3d5a;
            margin-bottom: 5px;
            font-weight: 700;
        }
        .mes-destaque {
            text-align: center;
            color: #d68102;
            font-size: 1.2rem;
            font-weight: bold;
            margin-top: 0;
            margin-bottom: 25px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        .container {
            max-width: 1300px;
            margin: 0 auto;
            background: #fff;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.06); 
        }
        .controls, .export-controls, .backup-controls {
            display: flex;
            justify-content: space-between;
            margin-bottom: 25px;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
        }
        .export-controls {
            margin-top: 25px;
            justify-content: flex-end;
            gap: 15px;
        }
        .backup-controls {
            justify-content: flex-start;
            margin-bottom: 0;
        }
        
        /* Inputs Gerais */
        input[type="text"]#novo-aluno, input[type="month"] {
            padding: 10px 12px;
            border: 1px solid #cbd5e1;
            border-radius: 6px;
            outline: none;
            transition: all 0.3s ease;
            box-shadow: inset 0 1px 3px rgba(0,0,0,0.03);
        }
        input[type="text"]#novo-aluno:focus, input[type="month"]:focus {
            border-color: #3498db;
            box-shadow: 0 0 0 3px rgba(52, 152, 219, 0.2);
        }
        
        /* BOTÕES ELEGANTES */
        button {
            padding: 10px 20px;
            background: linear-gradient(135deg, #2980b9, #1c5986);
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
            letter-spacing: 0.5px;
            box-shadow: 0 4px 6px rgba(41, 128, 185, 0.3);
            transition: all 0.3s ease;
        }
        button:hover { 
            background: linear-gradient(135deg, #3498db, #216a9e);
            transform: translateY(-2px);
            box-shadow: 0 6px 12px rgba(41, 128, 185, 0.4);
        }
        button:active {
            transform: translateY(0);
            box-shadow: 0 2px 4px rgba(41, 128, 185, 0.3);
        }
        
        .btn-danger { 
            background: linear-gradient(135deg, #e74c3c, #c0392b); 
            padding: 6px 12px; 
            box-shadow: 0 3px 5px rgba(231, 76, 60, 0.3);
        }
        .btn-danger:hover { background: linear-gradient(135deg, #ff6b6b, #e74c3c); }
        
        .btn-excel { background: linear-gradient(135deg, #0097e6, #007bc2); }
        .btn-excel:hover { background: linear-gradient(135deg, #00a8ff, #0097e6); }
        
        .btn-print { background: linear-gradient(135deg, #273c75, #192a56); }
        .btn-print:hover { background: linear-gradient(135deg, #354e96, #273c75); }

        .btn-backup { background: linear-gradient(135deg, #8e44ad, #732d91); }
        .btn-backup:hover { background: linear-gradient(135deg, #9b59b6, #8e44ad); }

        .btn-import { background: linear-gradient(135deg, #f39c12, #d35400); }
        .btn-import:hover { background: linear-gradient(135deg, #f1c40f, #f39c12); }

        /* Tabela */
        .table-responsive {
            overflow-x: auto;
            width: 100%;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05); 
        }
        table {
            width: 100%;
            border-collapse: separate; 
            border-spacing: 0;
            min-width: 1200px;
            background-color: #fff;
        }
        th, td {
            padding: 12px 8px;
            text-align: center;
            border-bottom: 1px solid #edf2f7; 
            border-right: 1px solid #edf2f7;
            transition: background-color 0.2s;
        }
        th:last-child, td:last-child { border-right: none; }
        tr:last-child td { border-bottom: none; }
        th {
            background: linear-gradient(135deg, #2c3e50, #1a252f); 
            color: white;
            font-size: 13px;
            font-weight: 600;
            letter-spacing: 0.5px;
        }
        tbody tr:nth-child(even) { background-color: #f8fafc; }
        tbody tr:hover { background-color: #e2e8f0; }

        .input-data-header, .eval-input {
            width: 48px;
            font-size: 13px;
            padding: 6px;
            text-align: center;
            border: 1px solid #cbd5e1;
            border-radius: 4px;
            background-color: #fff;
            color: #334155;
            box-shadow: inset 0 1px 2px rgba(0,0,0,0.06);
            transition: all 0.3s ease;
        }
        .input-data-header:focus, .eval-input:focus {
            border-color: #3498db;
            outline: none;
            box-shadow: 0 0 0 3px rgba(52, 152, 219, 0.2), inset 0 1px 2px rgba(0,0,0,0.06);
        }

        input[type="checkbox"] {
            width: 18px;
            height: 18px;
            cursor: pointer;
            accent-color: #2980b9; 
            transition: transform 0.2s ease;
        }
        input[type="checkbox"]:hover { transform: scale(1.2); }

        .nome-aluno { text-align: left; min-width: 150px; font-weight: 600; color: #1e293b; padding-left: 15px; }
        .col-faltas { font-weight: bold; color: #c0392b; background-color: #fdedec; }
        tbody tr:nth-child(even) .col-faltas { background-color: #fadbd8; }
        .media-aprovado { color: #10b981; font-weight: bold; }
        .media-reprovado { color: #ef4444; font-weight: bold; }

        @media print {
            body { background-color: #fff; padding: 0; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
            .container { box-shadow: none; padding: 0; max-width: 100%; }
            .controls, .export-controls, .backup-controls, .col-acoes { display: none !important; }
            .mes-destaque { color: #000; font-size: 14pt; border-bottom: 2px solid #000; padding-bottom: 10px; }
            h1 { font-size: 18pt; color: #000; }
            table { min-width: 100%; font-size: 11pt; border-collapse: collapse; box-shadow: none; }
            th, td { border: 1.5px solid #000 !important; padding: 6px; color: #000; }
            th { background: #f0f0f0 !important; color: #000 !important; }
            tr { page-break-inside: avoid; }
            input[type="number"], .input-data-header { border: none; background: transparent; width: 100%; padding: 0; text-align: center; color: black !important; font-weight: bold; font-size: 11pt; box-shadow: none; }
            .input-data-header::placeholder { color: transparent; }
            input[type="checkbox"] { width: 16px; height: 16px; accent-color: black; }
            .table-responsive { overflow-x: visible; box-shadow: none; }
            @page { size: A4 landscape; margin: 15mm; }
        }
    </style>
</head>
<body>

<div class="container">
    <h1>Diário de Classe</h1>
    <div class="mes-destaque" id="titulo-mes-atual">Carregando mês...</div>
    
    <div class="controls">
        <div>
            <input type="text" id="novo-aluno" placeholder="Nome do Aluno">
            <button onclick="adicionarAluno()">Adicionar Aluno</button>
        </div>
        <div>
            <label for="mes-referencia"><strong>Mês/Ano: </strong></label>
            <input type="month" id="mes-referencia" onchange="mudarMes()">
        </div>
    </div>

    <div class="table-responsive">
        <table>
            <thead id="cabecalho-tabela">
                <!-- Cabeçalho dinâmico -->
            </thead>
            <tbody id="tabela-alunos">
                <!-- Alunos dinâmicos -->
            </tbody>
        </table>
    </div>

    <div class="export-controls">
        <div class="backup-controls">
            <button class="btn-backup" onclick="exportarBackup()">💾 Salvar Backup dos Dados</button>
            <button class="btn-import" onclick="document.getElementById('import-file').click()">📂 Carregar Backup</button>
            <input type="file" id="import-file" style="display: none;" accept=".json" onchange="importarBackup(event)">
        </div>
        <div>
            <button class="btn-excel" onclick="exportarExcel()">📥 Exportar Excel (Mês Atual)</button>
            <button class="btn-print" onclick="window.print()">🖨️ Imprimir PDF</button>
        </div>
    </div>
</div>

<script>
    const DIAS_LETIVOS = 22;
    const mesesExtenso = ['Janeiro', 'Fevereiro', 'Março', 'Abril', 'Maio', 'Junho', 'Julho', 'Agosto', 'Setembro', 'Outubro', 'Novembro', 'Dezembro'];
    
    let mesAtual = "";
    let alunos = [];
    let datasColunas = [];
    
    let dadosMensais = JSON.parse(localStorage.getItem('diarioDadosMensais')) || {};
    let listaAlunosGlobais = JSON.parse(localStorage.getItem('diarioListaAlunosGlobais')) || [];

    function carregarMes(mesSelecionado) {
        mesAtual = mesSelecionado;
        
        if (!dadosMensais[mesAtual]) {
            dadosMensais[mesAtual] = {
                datasColunas: new Array(DIAS_LETIVOS).fill(''),
                alunos: listaAlunosGlobais.map(nome => ({
                    nome: nome,
                    presencas: new Array(DIAS_LETIVOS).fill(false),
                    notas: ['', '', '', '']
                }))
            };
        } else {
            let alunosDoMes = dadosMensais[mesAtual].alunos;
            let nomesNoMes = alunosDoMes.map(a => a.nome);

            listaAlunosGlobais.forEach(nomeGlobal => {
                if (!nomesNoMes.includes(nomeGlobal)) {
                    alunosDoMes.push({
                        nome: nomeGlobal,
                        presencas: new Array(DIAS_LETIVOS).fill(false),
                        notas: ['', '', '', '']
                    });
                }
            });
        }

        alunos = dadosMensais[mesAtual].alunos;
        datasColunas = dadosMensais[mesAtual].datasColunas;

        atualizarTituloMes();
        renderizarCabecalho();
        renderizarTabela();
    }

    function mudarMes() {
        const novoMes = document.getElementById('mes-referencia').value;
        if (novoMes) carregarMes(novoMes);
    }

    function salvarDados() {
        dadosMensais[mesAtual] = { datasColunas: datasColunas, alunos: alunos };
        localStorage.setItem('diarioDadosMensais', JSON.stringify(dadosMensais));
        localStorage.setItem('diarioListaAlunosGlobais', JSON.stringify(listaAlunosGlobais));
    }

    function atualizarTituloMes() {
        if(mesAtual) {
            const [ano, mes] = mesAtual.split('-');
            const nomeMes = mesesExtenso[parseInt(mes) - 1];
            document.getElementById('titulo-mes-atual').innerText = `Mês Referência: ${nomeMes} / ${ano}`;
        }
    }

    function atualizarDataColuna(index, valor) {
        datasColunas[index] = valor;
        salvarDados();
        renderizarTabela();
    }

    function renderizarCabecalho() {
        const thead = document.getElementById('cabecalho-tabela');
        let htmlDias = '';
        for (let i = 0; i < DIAS_LETIVOS; i++) {
            const valorAtual = datasColunas[i] ? datasColunas[i] : '';
            htmlDias += `<th class="dia"><input type="text" class="input-data-header" placeholder="D${i+1}" value="${valorAtual}" oninput="atualizarDataColuna(${i}, this.value)" title="Digite a data"></th>`;
        }
        thead.innerHTML = `<tr><th>Nome do Aluno</th>${htmlDias}<th title="Total de Faltas">Faltas</th><th>Av. 1</th><th>Av. 2</th><th>Av. 3</th><th>Av. 4</th><th>Média</th><th class="col-acoes">Ações</th></tr>`;
    }

    function renderizarTabela() {
        const tbody = document.getElementById('tabela-alunos');
        tbody.innerHTML = '';
        alunos.forEach((aluno, index) => {
            const media = calcularMedia(aluno.notas);
            const classeMedia = media >= 6 ? 'media-aprovado' : (media > 0 ? 'media-reprovado' : '');
            const totalFaltas = aluno.presencas.filter((p, i) => p === false && datasColunas[i] && datasColunas[i].trim() !== '').length;

            let checkboxesPresenca = '';
            for (let i = 0; i < DIAS_LETIVOS; i++) {
                const isChecked = aluno.presencas[i] ? 'checked' : '';
                checkboxesPresenca += `<td class="dia"><input type="checkbox" onchange="atualizarPresenca(${index}, ${i}, this.checked)" ${isChecked}></td>`;
            }

            tbody.innerHTML += `
                <tr>
                    <td class="nome-aluno">${aluno.nome}</td>
                    ${checkboxesPresenca}
                    <td class="col-faltas">${totalFaltas}</td>
                    <td><input type="number" class="eval-input" min="0" max="10" step="0.5" value="${aluno.notas[0]}" onchange="atualizarNota(${index}, 0, this.value)"></td>
                    <td><input type="number" class="eval-input" min="0" max="10" step="0.5" value="${aluno.notas[1]}" onchange="atualizarNota(${index}, 1, this.value)"></td>
                    <td><input type="number" class="eval-input" min="0" max="10" step="0.5" value="${aluno.notas[2]}" onchange="atualizarNota(${index}, 2, this.value)"></td>
                    <td><input type="number" class="eval-input" min="0" max="10" step="0.5" value="${aluno.notas[3]}" onchange="atualizarNota(${index}, 3, this.value)"></td>
                    <td class="${classeMedia}">${media ? media.toFixed(1) : '-'}</td>
                    <td class="col-acoes"><button class="btn-danger" onclick="removerAluno(${index})">X</button></td>
                </tr>
            `;
        });
    }

    function adicionarAluno() {
        const inputNome = document.getElementById('novo-aluno');
        const nome = inputNome.value.trim();
        if (nome) {
            if(!listaAlunosGlobais.includes(nome)) listaAlunosGlobais.push(nome);
            if(!alunos.find(a => a.nome === nome)) alunos.push({ nome: nome, presencas: new Array(DIAS_LETIVOS).fill(false), notas: ['', '', '', ''] });
            inputNome.value = '';
            salvarDados();
            renderizarTabela();
        } else {
            alert('Por favor, digite o nome do aluno.');
        }
    }

    function removerAluno(index) {
        if(confirm('Tem certeza que deseja remover este aluno deste mês?')) {
            const nomeRemovido = alunos[index].nome;
            alunos.splice(index, 1);
            if(confirm('Deseja também remover este aluno da lista global? (Ele não aparecerá em novos meses)')) {
                listaAlunosGlobais = listaAlunosGlobais.filter(n => n !== nomeRemovido);
            }
            salvarDados();
            renderizarTabela();
        }
    }

    function atualizarNota(indexAluno, indexNota, valor) {
        alunos[indexAluno].notas[indexNota] = valor;
        salvarDados();
        renderizarTabela();
    }

    function atualizarPresenca(indexAluno, indexDia, valor) {
        alunos[indexAluno].presencas[indexDia] = valor;
        salvarDados();
        renderizarTabela(); 
    }

    function calcularMedia(notas) {
        let soma = 0, cont = 0;
        notas.forEach(nota => { if (nota !== '') { soma += parseFloat(nota); cont++; } });
        return cont > 0 ? (soma / cont) : 0;
    }

    function exportarExcel() {
        let csv = 'Nome do Aluno;';
        for (let i = 0; i < DIAS_LETIVOS; i++) {
            const tituloData = (datasColunas[i] && datasColunas[i].trim() !== '') ? datasColunas[i] : `Dia ${i+1}`;
            csv += `${tituloData};`;
        }
        csv += 'Faltas;Avaliacao 1;Avaliacao 2;Avaliacao 3;Avaliacao 4;Media Final\n';

        alunos.forEach(aluno => {
            let linha = `${aluno.nome};`;
            aluno.presencas.forEach((p, i) => { 
                const diaPreenchido = datasColunas[i] && datasColunas[i].trim() !== '';
                if (!diaPreenchido) { linha += '-;'; } 
                else { linha += p ? 'P;' : 'F;'; }
            });
            const totalFaltas = aluno.presencas.filter((p, i) => p === false && datasColunas[i] && datasColunas[i].trim() !== '').length;
            linha += `${totalFaltas};`;
            aluno.notas.forEach(n => { linha += `${n ? n.replace('.', ',') : ''};`; });
            const media = calcularMedia(aluno.notas);
            linha += media ? `${media.toFixed(1).replace('.', ',')}\n` : '-\n';
            csv += linha;
        });

        const blob = new Blob(["\uFEFF" + csv], { type: 'text/csv;charset=utf-8;' });
        const link = document.createElement("a");
        link.href = URL.createObjectURL(blob);
        link.download = `Diario_Classe_${mesAtual}.csv`;
        link.style.display = 'none';
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
    }

    // --- NOVAS FUNÇÕES DE BACKUP ---
    function exportarBackup() {
        const backupData = {
            dadosMensais: dadosMensais,
            listaAlunosGlobais: listaAlunosGlobais
        };
        const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(backupData));
        const link = document.createElement("a");
        link.href = dataStr;
        link.download = "backup_diario_classe.json";
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
        alert("Backup salvo com sucesso no seu computador!");
    }

    function importarBackup(event) {
        const file = event.target.files[0];
        if (!file) return;

        const reader = new FileReader();
        reader.onload = function(e) {
            try {
                const dadosImportados = JSON.parse(e.target.result);
                if (dadosImportados.dadosMensais && dadosImportados.listaAlunosGlobais) {
                    dadosMensais = dadosImportados.dadosMensais;
                    listaAlunosGlobais = dadosImportados.listaAlunosGlobais;
                    
                    localStorage.setItem('diarioDadosMensais', JSON.stringify(dadosMensais));
                    localStorage.setItem('diarioListaAlunosGlobais', JSON.stringify(listaAlunosGlobais));
                    
                    alert("Backup restaurado com sucesso!");
                    // Recarrega o mês atual para exibir os dados importados
                    const mesParaCarregar = document.getElementById('mes-referencia').value || new Date().toISOString().slice(0, 7);
                    carregarMes(mesParaCarregar);
                } else {
                    alert("Arquivo de backup inválido. Certifique-se de que é o arquivo correto.");
                }
            } catch (error) {
                alert("Erro ao ler o arquivo de backup.");
            }
        };
        reader.readAsText(file);
        // Reseta o input para permitir importar o mesmo arquivo novamente se necessário
        event.target.value = '';
    }

    // --- INICIALIZAÇÃO ---
    const mesInicial = new Date().toISOString().slice(0, 7);
    document.getElementById('mes-referencia').value = mesInicial;
    carregarMes(mesInicial);
</script>

</body>
</html>
